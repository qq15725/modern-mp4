name: 🚀 Publish Package

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - name: ⤵️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 🎉 Install pnpm
        uses: pnpm/action-setup@v4
      - name: 🎉 Set node version to 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - name: 🚧 Install deps
        run: pnpm install
      - name: 📦 Build
        run: pnpm run build
      - name: 🔀 Publish package
        run: |
          set -o pipefail
          npm publish --access public 2>&1 | tee "$RUNNER_TEMP/npm-publish.log" || {
            while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done < <(grep '^npm error' "$RUNNER_TEMP/npm-publish.log" | head -20)
            exit 1
          }
