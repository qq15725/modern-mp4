name: 🚀 Publish Package

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Release
    steps:
      - name: ⤵️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 🎉 Install pnpm
        uses: pnpm/action-setup@v4
      - name: 🎉 Set node version to 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - name: 🚧 Install deps
        run: pnpm install
      - name: 📦 Build
        run: pnpm run build
      - name: 🔀 Publish package
        run: |
          set -o pipefail
          npm publish --access public 2>&1 | tee "$RUNNER_TEMP/npm-publish.log" || {
            while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done < <(grep '^npm error' "$RUNNER_TEMP/npm-publish.log" | head -20)
            exit 1
          }
      - name: 确认 npm 版本可安装
        run: |
          expected_version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          for attempt in $(seq 1 45); do
            published_version=$(npm view "modern-mp4@$expected_version" version 2>/dev/null || true)
            if [ "$published_version" = "$expected_version" ]; then
              echo "::notice::modern-mp4@$expected_version 已在 npm 可用"
              exit 0
            fi
            echo "等待 npm 版本可用 ($attempt/45)"
            sleep 20
          done
          echo "::error::npm 已接收上传，但 modern-mp4@$expected_version 仍不可安装，请检查 npm 发布处理状态"
          exit 1
